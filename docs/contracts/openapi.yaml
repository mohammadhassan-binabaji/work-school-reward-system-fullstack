  # ==========================================
  # IN-APP NOTIFICATIONS
  # ==========================================
  /notifications:
    get:
      summary: Retrieve authenticated user's notification inbox
      description: |
        Returns a paginated list of in-app notifications addressed to the current authenticated user.
        Supports filtering by read status (ALL, UNREAD, READ).
        Results are ordered deterministically by creation date descending with ID descending as tie-breaker (`createdAt DESC, id DESC`).
      operationId: getNotifications
      tags:
        - Notifications
      security:
        - SessionAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based index)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page (default 20, max 50)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: status
          in: query
          description: Filter notifications by read status
          required: false
          schema:
            type: string
            enum: [ALL, UNREAD, READ]
            default: ALL
      responses:
        '200':
          description: Paginated notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/unread-count:
    get:
      summary: Retrieve authenticated user's unread notification count
      description: Returns the total number of notifications in UNREAD status addressed to the authenticated user.
      operationId: getUnreadNotificationCount
      tags:
        - Notifications
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/read-all:
    patch:
      summary: Mark all unread notifications as read
      description: |
        Bulk operation transitioning all UNREAD notifications addressed to the authenticated user to READ status.
        Sets `readAt` to current timestamp for all updated records.
      operationId: markAllNotificationsAsRead
      tags:
        - Notifications
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Bulk mark-as-read outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReadResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/{id}/read:
    patch:
      summary: Mark an individual notification as read
      description: |
        Transitions the specified notification's status to READ and sets `readAt` to current timestamp.
        Idempotent: if already READ, returns the notification with original `readAt` intact.
        Returns 404 if the notification does not exist or does not belong to the authenticated user.
      operationId: markNotificationAsRead
      tags:
        - Notifications
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          description: Unique UUID of the notification
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification successfully marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
