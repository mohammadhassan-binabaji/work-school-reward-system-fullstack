  # ==========================================
  # REPORTS & EXPORTS
  # ==========================================
  /reports/point-flow:
    get:
      summary: Query Filtered Point Flow Report
      description: >-
        Query role-scoped immutable audit log records. Student callers can only query logs involving
        their own account; teachers can query logs involving themselves or their assigned students;
        administrators have unrestricted school-wide visibility. Transfer amounts are positive magnitudes
        between debited sourceType and credited recipientType. Optional reasonDetail is present for
        TEACHER_AWARD_STUDENT (task name) and ADMIN_ADJUST_STUDENT (admin note); null for other actions.
      security:
        - SessionAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: studentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: teacherId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: classId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: subjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: actionType
          in: query
          required: false
          schema: { type: string }
        - name: excludeActionType
          in: query
          required: false
          description: Exclude audit logs matching this ActionType (e.g. REWARD_RECEIVE_COMPLETE)
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Filtered audit logs returned (FR-069, FR-070)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedPointFlowResponse' }

  /reports/point-flow/export:
    get:
      summary: Export Point Flow Report
      security:
        - SessionAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, xlsx, pdf] }
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: studentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: teacherId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: classId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: subjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: actionType
          in: query
          required: false
          schema: { type: string }
        - name: excludeActionType
          in: query
          required: false
          description: Exclude audit logs matching this ActionType (e.g. REWARD_RECEIVE_COMPLETE)
          schema: { type: string }
      responses:
        '200':
          description: Binary file stream (FR-071)
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="point-flow-report.csv"' }
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }

