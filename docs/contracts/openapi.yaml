openapi: 3.0.3
info:
  title: Student Reward System Backend API
  version: 1.0.0
  description: >
    Complete RESTful backend specification for the Student Reward System.
    Enforces Role-Based Access Control (RBAC: ADMIN, TEACHER, STUDENT) and Stateful Session Authentication.
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Stateful Session ID formatted as `Bearer <session_id>` (or via `session_id` HTTP-only cookie).

  headers:
    X-Correlation-Id:
      description: Unique request correlation identifier propagated through all logs and response headers.
      schema:
        type: string
        format: uuid

  responses:
    UnauthorizedError:
      description: Unauthorized - Authentication required or session expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource not found or inaccessible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - errorCode
        - message
        - correlationId
        - timestamp
      properties:
        statusCode:
          type: integer
          example: 400
        errorCode:
          type: string
          example: INSUFFICIENT_POINT_BALANCE
        message:
          type: string
          example: Teacher point balance is insufficient to perform this award.
        correlationId:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        timestamp:
          type: string
          format: date-time
          example: "2026-09-24T10:00:00.000Z"

    UserResponse:
      type: object
      required:
        - id
        - nationalId
        - firstName
        - lastName
        - username
        - role
        - accountState
      properties:
        id:
          type: string
          format: uuid
        nationalId:
          type: string
          example: "1234567890"
        firstName:
          type: string
          example: "Jane"
        lastName:
          type: string
          example: "Doe"
        username:
          type: string
          example: "jane.doe"
        role:
          type: string
          enum: [ADMIN, TEACHER, STUDENT]
        accountState:
          type: string
          enum: [ACTIVE, INACTIVE, DEACTIVATED, DEPARTED]
        imageUrl:
          type: string
          nullable: true
          example: "/uploads/1790965108171-sample.jpg"
        teacherProfile:
          type: object
          nullable: true
          properties:
            pointBalance:
              type: integer
              example: 500
        studentProfile:
          type: object
          nullable: true
          properties:
            classId:
              type: string
              format: uuid
              nullable: true
            currentBalance:
              type: integer
              example: 150
            reservedBalance:
              type: integer
              example: 50
            highestBalance:
              type: integer
              example: 200
            currentTierId:
              type: string
              format: uuid
              nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - nationalId
        - password
      properties:
        nationalId:
          type: string
          pattern: '^[0-9]{10}$'
          example: "1234567890"
        password:
          type: string
          format: password
          example: "SecureP@ssw0rd!"

    LoginResponse:
      type: object
      required:
        - sessionId
        - user
      properties:
        sessionId:
          type: string
          example: "sess_a8f93e2b1c4d"
        role:
          type: string
          enum: [ADMIN, TEACHER, STUDENT]
        user:
          $ref: '#/components/schemas/UserResponse'

    PointTransferTaskDto:
      type: object
      required:
        - id
        - name
        - isActive
        - options
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Doing Homework"
        description:
          type: string
          nullable: true
          example: "Completing daily assignments on time"
        isActive:
          type: boolean
          example: true
        options:
          type: array
          items:
            type: object
            required:
              - id
              - points
            properties:
              id:
                type: string
                format: uuid
              points:
                type: integer
                example: 10
              label:
                type: string
                nullable: true
                example: "Excellent Quality"

    TeacherAwardRequest:
      type: object
      required:
        - studentId
        - classId
        - subjectId
        - taskId
        - optionId
      properties:
        studentId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        optionId:
          type: string
          format: uuid

    RewardDto:
      type: object
      required:
        - id
        - name
        - description
        - pointPrice
        - requiresApproval
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "School Notebook"
        description:
          type: string
          example: "Custom engraved spiral notebook"
        imageUrl:
          type: string
          nullable: true
        pointPrice:
          type: integer
          example: 50
        requiresApproval:
          type: boolean
          example: false
        inventoryQuantity:
          type: integer
          nullable: true
          example: 25
        status:
          type: string
          enum: [ACTIVE, REMOVED]

    RewardRequestDto:
      type: object
      required:
        - id
        - studentId
        - rewardId
        - priceAtRequest
        - requiresApproval
        - status
        - reservedAmount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        rewardId:
          type: string
          format: uuid
        priceAtRequest:
          type: integer
          example: 50
        requiresApproval:
          type: boolean
          example: false
        status:
          type: string
          enum: [PENDING_TO_APPROVE, PENDING_TO_RECEIVE, COMPLETED, DECLINED]
        reservedAmount:
          type: integer
          example: 50
        declineReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ActivityDto:
      type: object
      required:
        - id
        - type
        - title
        - description
        - pointValue
        - completionLimit
        - status
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [CHALLENGE, MISSION]
        title:
          type: string
          example: "Math Olympiad Participation"
        description:
          type: string
          example: "Solve 10 challenge problems and submit working notes."
        pointValue:
          type: integer
          example: 100
        completionLimit:
          type: integer
          example: 1
        status:
          type: string
          enum: [ACTIVE, INACTIVE, REMOVED]
        completionCount:
          type: integer
          description: Populated for student requests. Number of approved completions by the requester.
          example: 0
        isBanned:
          type: boolean
          description: Populated for student requests. Indicates if requester is currently banned from this activity.
          example: false
        isDone:
          type: boolean
          description: Populated for student requests. Indicates if requester has reached completionLimit.
          example: false
        verificationStatus:
          type: string
          nullable: true
          enum: [PENDING, ACCEPTED, REJECTED]
          description: Populated for student requests. Latest verification request status by the requester for this activity (null if never submitted).
          example: PENDING

    TaskProposalDto:
      type: object
      required:
        - id
        - studentId
        - description
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          example: "Organize the class library"
        description:
          type: string
          example: "Organize the class library bookshelves"
        status:
          type: string
          enum: [PENDING_TO_APPROVE, READY_TO_DO, COMPLETED, DECLINED, CANCELED]
        assignedPointValue:
          type: integer
          nullable: true
          example: 30
        declineReason:
          type: string
          nullable: true
          example: "Task not aligned with current school projects"
        createdAt:
          type: string
          format: date-time

    RankingResponseDto:
      type: object
      required:
        - scope
        - totalActiveStudents
        - topStudents
      properties:
        scope:
          type: string
          enum: [CLASS, SCHOOL]
        totalActiveStudents:
          type: integer
          example: 32
        selfRank:
          type: object
          nullable: true
          properties:
            rank:
              type: integer
              example: 15
            currentPoints:
              type: integer
              example: 140
            studentName:
              type: string
              example: "Jane Doe"
            imageUrl:
              type: string
              nullable: true
              example: "/uploads/1790965108171-sample.jpg"
        topStudents:
          type: array
          items:
            type: object
            required:
              - rank
              - studentName
              - currentPoints
            properties:
              rank:
                type: integer
                example: 1
              studentName:
                type: string
                example: "Alice Smith"
              imageUrl:
                type: string
                nullable: true
                example: "/uploads/1790965108171-sample.jpg"
              currentPoints:
                type: integer
                example: 350


    UpdateClassDto:
      type: object
      properties:
        name:
          type: string
        gradeLevel:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    AssignStudentClassDto:
      type: object
      required:
        - studentId
        - classId
      properties:
        studentId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid

    UpdateSubjectDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    SetPoolBalanceDto:
      type: object
      required:
        - balance
      properties:
        balance:
          type: integer
          minimum: 0

    UpdatePointTaskDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean

    UpdateRewardMetadataDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        inventoryQuantity:
          type: integer
          minimum: 0

    UpdateActivityMetadataDto:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        completionLimit:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ACTIVE, INACTIVE, REMOVED]

    SubmitVerificationDto:
      type: object
      required:
        - textDescription
      properties:
        textDescription:
          type: string
        fileAttachmentUrl:
          type: string

    RejectVerificationDto:
      type: object
      properties:
        rejectionReason:
          type: string

    DeclineProposalDto:
      type: object
      properties:
        declineReason:
          type: string

    TierConfigurationDto:
      type: object
      required:
        - id
        - tierNumber
        - name
        - minPointsThreshold
      properties:
        id:
          type: string
          format: uuid
        tierNumber:
          type: integer
          minimum: 1
          maximum: 5
          example: 1
        name:
          type: string
          example: "برنز"
        minPointsThreshold:
          type: integer
          minimum: 0
          example: 0
        themeId:
          type: string
          example: "bronze_ember"
          description: "Pre-defined color theme ID (one of the 10 supported semantic themes)"
        motivationalMessages:
          type: array
          items:
            type: string
          description: "Custom motivational sentences for this tier"
          example: ["آغاز یک مسیر درخشان! به تلاشت ادامه بده..."]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TierItemDto:
      type: object
      required:
        - tierNumber
        - name
        - minPointsThreshold
      properties:
        tierNumber:
          type: integer
          minimum: 1
          maximum: 5
          example: 1
        name:
          type: string
          maxLength: 100
          example: "برنز"
        minPointsThreshold:
          type: integer
          minimum: 0
          example: 0
        themeId:
          type: string
          maxLength: 50
          example: "bronze_ember"
          description: "Pre-defined color theme ID"
        motivationalMessages:
          type: array
          items:
            type: string
          description: "List of motivational messages for this tier"

    UpdateTierConfigurationsDto:
      type: object
      required:
        - tiers
      properties:
        tiers:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/TierItemDto'
          description: "Must provide exactly 5 tiers (tierNumber 1 to 5)"

    CreateGuidanceCategoryDto:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 150
        iconKey:
          type: string
          maxLength: 100
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        status:
          type: string
          enum: [ACTIVE, REMOVED]

    UpdateGuidanceCategoryDto:
      type: object
      properties:
        title:
          type: string
          maxLength: 150
        iconKey:
          type: string
          maxLength: 100
        sortOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, REMOVED]

    GuidanceCategoryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        iconKey:
          type: string
        sortOrder:
          type: integer
        status:
          type: string
          enum: [ACTIVE, REMOVED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cards:
          type: array
          items:
            $ref: '#/components/schemas/GuidanceCardDto'

    CreateGuidanceCardDto:
      type: object
      required:
        - categoryId
        - title
        - description
        - logoKey
        - pointRangeLabel
      properties:
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 150
        description:
          type: string
        logoKey:
          type: string
          maxLength: 100
        pointRangeLabel:
          type: string
          maxLength: 100
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        status:
          type: string
          enum: [ACTIVE, REMOVED]

    GuidanceCardDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        logoKey:
          type: string
        pointRangeLabel:
          type: string
        sortOrder:
          type: integer
        status:
          type: string
          enum: [ACTIVE, REMOVED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateGuidanceCardDto:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 150
        description:
          type: string
        logoKey:
          type: string
          maxLength: 100
        pointRangeLabel:
          type: string
          maxLength: 100
        sortOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, REMOVED]

    VerificationRequestDto:
      type: object
      required:
        - id
        - studentId
        - activityId
        - textDescription
        - status
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        textDescription:
          type: string
        fileAttachmentUrl:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]
        rejectionReason:
          type: string
        reviewedByAdminId:
          type: string
          format: uuid

    StudentActivityProgressDto:
      type: object
      required:
        - studentId
        - activityId
        - completionCount
        - rejectionCount
      properties:
        studentId:
          type: string
          format: uuid
        activityId:
          type: string
          format: uuid
        completionCount:
          type: integer
        rejectionCount:
          type: integer
        bannedUntil:
          type: string
          format: date-time

    UpdateTierConfigurationsDto:
      type: object
      required:
        - tiers
      properties:
        tiers:
          type: array
          items:
            type: object
            required:
              - tierNumber
              - name
              - minPointsThreshold
            properties:
              tierNumber:
                type: integer
                minimum: 1
                maximum: 5
              name:
                type: string
              minPointsThreshold:
                type: integer
                minimum: 0

    DailyStudentSnapshotDto:
      type: object
      required:
        - studentId
        - balance
        - schoolRank
        - snapshotDate
      properties:
        studentId:
          type: string
          format: uuid
        balance:
          type: integer
        schoolRank:
          type: integer
          description: School-wide rank at snapshot time (standard competition ranking)
          example: 3
        classRank:
          type: integer
          nullable: true
          description: Rank within the student's class at snapshot time. Null if student has no class.
          example: 1
        snapshotDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    StudentBalancePointDto:
      type: object
      required:
        - date
        - balance
      properties:
        date:
          type: string
          example: '2026-10-18'
        balance:
          type: integer
          minimum: 0
          example: 150

    StudentBalanceHistoryResponseDto:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StudentBalancePointDto'
        pagination:
          type: object
          required:
            - limit
            - hasMore
          properties:
            limit:
              type: integer
              example: 14
            nextCursor:
              type: string
              nullable: true
              example: '2026-10-04'
            hasMore:
              type: boolean
              example: true

    AuditLogActor:
      type: object
      required:
        - id
        - nationalId
        - firstName
        - lastName
        - username
        - role
      properties:
        id:
          type: string
          format: uuid
        nationalId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, TEACHER, STUDENT]

    PointAuditLogResponse:
      type: object
      required:
        - id
        - correlationId
        - actorRole
        - sourceType
        - recipientType
        - amount
        - actionType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        correlationId:
          type: string
          example: 'c1f2e3d4-5678-90ab-cdef-1234567890ab'
        actorId:
          type: string
          format: uuid
          nullable: true
        actor:
          $ref: '#/components/schemas/AuditLogActor'
          nullable: true
        actorRole:
          type: string
          enum: [ADMIN, TEACHER, STUDENT, SYSTEM]
        sourceType:
          type: string
          enum: [SYSTEM_POOL, TEACHER, STUDENT_CURRENT, STUDENT_RESERVED]
        sourceId:
          type: string
          format: uuid
          nullable: true
        recipientType:
          type: string
          enum: [TEACHER, STUDENT_CURRENT, STUDENT_RESERVED, SYSTEM_POOL, NONE]
        recipientId:
          type: string
          format: uuid
          nullable: true
        amount:
          type: integer
          minimum: 1
          description: Non-negative magnitude of points transferred
          example: 50
        actionType:
          type: string
          enum:
            - POOL_FUND_TEACHER
            - TEACHER_AWARD_STUDENT
            - ADMIN_ADJUST_STUDENT
            - REWARD_RESERVE_POINTS
            - REWARD_DECLINE_RETURN
            - REWARD_REMOVE_RETURN
            - REWARD_RECEIVE_COMPLETE
            - CHALLENGE_AWARD_STUDENT
            - PROPOSAL_AWARD_STUDENT
            - STUDENT_DEPARTURE_DEDUCT
            - SET_POOL_BALANCE
            - TEACHER_DEPARTURE_RETURN
        reasonDetail:
          type: string
          nullable: true
          description: >-
            Optional supplemental detail text. Present only for TEACHER_AWARD_STUDENT
            (contains task name directly) and ADMIN_ADJUST_STUDENT (contains admin-supplied reason);
            null for all other action types.
          example: 'Special recognition award'
        relatedEntityType:
          type: string
          nullable: true
          example: 'TeacherClassSubjectAssignment'
        relatedEntityId:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: object
          nullable: true
          description: Contextual snapshot metadata for localized display
          properties:
            teacherName:
              type: string
            subjectName:
              type: string
            adminName:
              type: string
            studentName:
              type: string
            activityTitle:
              type: string
            proposalTitle:
              type: string
            rewardName:
              type: string
        resultingSourceBalance:
          type: integer
          nullable: true
        resultingRecipientBalance:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    PaginatedPointFlowResponse:
      type: object
      required:
        - total
        - limit
        - offset
        - data
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/PointAuditLogResponse'

    NotificationReadStatus:
      type: string
      enum:
        - UNREAD
        - READ

    OriginatingEntityType:
      type: string
      enum:
        - REWARD_REQUEST
        - TASK_PROPOSAL
        - PROPOSAL_MESSAGE
        - CHALLENGE_VERIFICATION
        - POINT_ALLOCATION
        - POINT_AWARD
        - POINT_ADJUSTMENT
        - ACTIVITY_BAN
        - ACTIVITY_UNBLOCK

    NotificationResponse:
      type: object
      required:
        - id
        - recipientId
        - subject
        - body
        - readStatus
        - readAt
        - originatingEntityType
        - originatingEntityId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "a8098c1a-f86e-11da-bd1a-00112444be1e"
        recipientId:
          type: string
          format: uuid
          example: "6ba7b810-9dad-11d1-80b4-00c04fd430c8"
        subject:
          type: string
          maxLength: 200
          example: "Points Awarded"
        body:
          type: string
          example: "Teacher Sarah Jenkins awarded you 25 points for task 'Math Quiz Excellence'."
        readStatus:
          $ref: '#/components/schemas/NotificationReadStatus'
          example: "UNREAD"
        readAt:
          type: string
          format: date-time
          nullable: true
          example: null
        originatingEntityType:
          $ref: '#/components/schemas/OriginatingEntityType'
          example: "POINT_AWARD"
        originatingEntityId:
          type: string
          format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-09T14:30:00.000Z"

    PaginationMeta:
      type: object
      required:
        - totalItems
        - itemCount
        - itemsPerPage
        - totalPages
        - currentPage
      properties:
        totalItems:
          type: integer
          example: 45
        itemCount:
          type: integer
          example: 20
        itemsPerPage:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 3
        currentPage:
          type: integer
          example: 1

    PaginatedNotificationsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    UnreadCountResponse:
      type: object
      required:
        - unreadCount
      properties:
        unreadCount:
          type: integer
          minimum: 0
          example: 4

    BulkReadResponse:
      type: object
      required:
        - updatedCount
      properties:
        updatedCount:
          type: integer
          minimum: 0
          example: 7

paths:
  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/initial-admin:
    post:
      summary: Provision Initial School Administrator
      description: Seeds the initial administrator account on a fresh installation (FR-001).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nationalId, firstName, lastName, username, password]
              properties:
                nationalId: { type: string, pattern: '^[0-9]{10}$' }
                firstName: { type: string }
                lastName: { type: string }
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '201':
          description: Admin provisioned successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '409':
          description: Initial admin already provisioned

  /auth/login:
    post:
      summary: User Login
      description: Authenticates user by 10-digit national ID and password, establishing a stateful session in Redis (FR-003, FR-004).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "sessionId=sess_a8f93e2b1c4d; Path=/; HttpOnly; SameSite=Strict"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid national ID or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      summary: Logout
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Session invalidated

  /auth/me:
    get:
      summary: Current Authenticated User Info
      security:
        - SessionAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }

  # ==========================================
  # USERS & ACCOUNTS (ADMIN ONLY)
  # ==========================================
  /users:
    get:
      summary: List Users (Admin only)
      description: List all users with optional role and accountState filters.
      security:
        - SessionAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [ADMIN, TEACHER, STUDENT]
        - name: accountState
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, DEACTIVATED, DEPARTED]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
    post:
      summary: Create User Account
      description: Admin creates an admin, teacher, or student account with optional profile image (FR-002, FR-003).
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nationalId, firstName, lastName, username, password, role]
              properties:
                nationalId: { type: string, pattern: '^[0-9]{10}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }

  /users/import/template:
    get:
      summary: Download Student Bulk Import Excel Template (Admin only)
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Excel template file (.xlsx) with columns including optional image filename
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /users/import/excel:
    post:
      summary: Bulk Import Student Accounts (Admin only)
      description: Bulk import students via Excel file and optional ZIP archive containing profile images matching image filenames specified in the Excel sheet.
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "Excel (.xlsx) file containing student rows"
                imagesZip:
                  type: string
                  format: binary
                  description: "Optional ZIP archive containing student images referenced by the '??? ???? ?????' column"
      responses:
        '201':
          description: Students imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  message: { type: string }
                  importedUsers:
                    type: array
                    items: { $ref: '#/components/schemas/UserResponse' }
        '400':
          description: Bad request (missing file or invalid structure)
        '422':
          description: Row-level validation errors (including declared image filename not found in ZIP)

  /users/{id}:
    get:
      summary: Get Single User by ID (Admin only)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }

  /users/{id}/state:
    patch:
      summary: Update User Account Lifecycle State
      description: Deactivates, reactivates, or marks user as departed (FR-010, FR-012, FR-014).
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountState]
              properties:
                accountState: { type: string, enum: [ACTIVE, INACTIVE, DEACTIVATED, DEPARTED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }

  # ==========================================
  # ACADEMIC STRUCTURE & ASSIGNMENTS
  # ==========================================
  /classes:
    get:
      summary: List Classes
      security:
        - SessionAuth: []
      parameters:
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
            description: Filter classes by active status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    gradeLevel: { type: string }
                    description: { type: string }
                    isActive: { type: boolean }
    post:
      summary: Create Class (Admin)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                gradeLevel: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Class created

  /classes/{id}:
    get:
      summary: Get Class Details by ID
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
    patch:
      summary: Update Class (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClassDto' }
      responses:
        '200':
          description: Class updated
    delete:
      summary: Delete Class (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Class deleted

  /classes/assign-student:
    post:
      summary: Assign or Reassign Student to Class (Admin)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignStudentClassDto' }
      responses:
        '201':
          description: Student assigned to class

  /classes/students/{id}/depart:
    post:
      summary: Mark Student as Departed and Clean Up Balances (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Student marked as departed and points refunded

  /subjects:
    get:
      summary: List Subjects
      security:
        - SessionAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    description: { type: string }
    post:
      summary: Create Subject (Admin)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Subject created

  /subjects/{id}:
    get:
      summary: Get Subject Details by ID
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
    patch:
      summary: Update Subject (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSubjectDto' }
      responses:
        '200':
          description: Subject updated
    delete:
      summary: Delete Subject (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Subject deleted

  /assignments:
    get:
      summary: List Active Teacher-Class-Subject Assignments
      security:
        - SessionAuth: []
      parameters:
        - name: teacherId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: classId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
    post:
      summary: Assign Teacher to Class and Subject (Admin)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacherId, classId, subjectId]
              properties:
                teacherId: { type: string, format: uuid }
                classId: { type: string, format: uuid }
                subjectId: { type: string, format: uuid }
      responses:
        '201':
          description: Assignment created (FR-011)

  /assignments/{id}:
    delete:
      summary: Remove Teacher Class Assignment (Admin)
      description: Removes class assignment while preserving teacher's point balance (FR-013).
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Assignment removed

  /assignments/teachers/{id}/depart:
    post:
      summary: Mark Teacher as Departed and Return Unspent Budget to Pool (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Teacher marked as departed and remaining budget returned to pool

  # ==========================================
  # POINT ECONOMY & TRANSFERS
  # ==========================================
  /points/pool:
    get:
      summary: Get Current System Point Pool Status (Admin only)
      security:
        - SessionAuth: []
      responses:
        '200':
          description: OK

  /points/pool/balance:
    post:
      summary: Set System Point Pool Balance (Admin only)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPoolBalanceDto' }
      responses:
        '201':
          description: Pool balance updated

  /points/pool/fund-teacher:
    post:
      summary: Fund Teacher Award Budget from System Pool (Admin)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacherId, amount]
              properties:
                teacherId: { type: string, format: uuid }
                amount: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Points successfully allocated (FR-016)

  /points/tasks:
    get:
      summary: List Point Transfer Tasks
      security:
        - SessionAuth: []
      parameters:
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
            description: Filter point tasks by active status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PointTransferTaskDto' }
    post:
      summary: Create Point Transfer Task (Admin)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, options]
              properties:
                name: { type: string }
                description: { type: string }
                options:
                  type: array
                  items:
                    type: object
                    required: [points]
                    properties:
                      points: { type: integer, minimum: 1 }
                      label: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointTransferTaskDto' }

  /points/tasks/{id}:
    get:
      summary: Get Point Task by ID
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointTransferTaskDto' }
    patch:
      summary: Update Point Task Definition (Admin only)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePointTaskDto' }
      responses:
        '200':
          description: Point task updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointTransferTaskDto' }
    delete:
      summary: Delete Point Task (Admin only)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Point task deleted

  /points/teacher-award:
    post:
      summary: Award Points from Teacher to Student
      description: Teacher awards points to an enrolled student in assigned class using a predefined task and discrete option (FR-018, FR-020, FR-021).
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherAwardRequest' }
      responses:
        '200':
          description: Points awarded successfully

  /points/admin-adjust:
    post:
      summary: Direct Administrator Point Adjustment
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, amount, reason]
              properties:
                studentId: { type: string, format: uuid }
                amount: { type: integer, description: "Positive or negative integer adjustment" }
                reason: { type: string }
      responses:
        '200':
          description: Balance adjusted (FR-023)

  # ==========================================
  # REWARDS & REDEMPTION
  # ==========================================
  /rewards:
    get:
      summary: List Active Catalog Rewards
      security:
        - SessionAuth: []
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            description: Include inactive/removed rewards (Admin/Teacher)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RewardDto' }
    post:
      summary: Create Reward (Admin)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, pointPrice, requiresApproval]
              properties:
                name: { type: string }
                description: { type: string }
                imageUrl: { type: string }
                pointPrice: { type: integer, minimum: 1 }
                requiresApproval: { type: boolean }
                inventoryQuantity: { type: integer, minimum: 0, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardDto' }

  /rewards/{id}:
    get:
      summary: Get Reward Details by ID
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardDto' }
    patch:
      summary: Update Reward Metadata (price is immutable) (Admin only)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRewardMetadataDto' }
      responses:
        '200':
          description: Reward updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardDto' }
    delete:
      summary: Remove Reward from Catalog (Admin)
      description: Closes active requests, returns reserved points, and records audit entries (FR-034).
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reward removed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardDto' }

  /reward-requests:
    get:
      summary: List Reward Requests
      security:
        - SessionAuth: []
      parameters:
        - name: studentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING_TO_APPROVE, PENDING_TO_RECEIVE, COMPLETED, DECLINED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RewardRequestDto' }
    post:
      summary: Request Reward (Student)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rewardId]
              properties:
                rewardId: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardRequestDto' }
        '409':
          description: Student already has a pending request for this reward (FR-096)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /reward-requests/{id}:
    get:
      summary: Get Reward Request by ID
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardRequestDto' }

  /reward-requests/{id}/approve:
    post:
      summary: Approve Reward Request (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Request approved; transitioned to PENDING_TO_RECEIVE (FR-032)

  /reward-requests/{id}/decline:
    post:
      summary: Decline Reward Request (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                declineReason:
                  type: string
                  example: "Item out of stock from supplier"
      responses:
        '200':
          description: Request declined; points returned to student balance (FR-032)

  /reward-requests/{id}/receive:
    post:
      summary: Mark Reward Request as Received / Delivered (Admin)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Request completed (FR-033)

  # ==========================================
  # CHALLENGES, MISSIONS & VERIFICATION
  # ==========================================
  /activities:
    get:
      summary: List Activities (Challenges & Missions)
      description: Returns all activities (or active only for students). When requested by a student, includes per-student progress fields (completionCount, isBanned, isDone, verificationStatus).
      security:
        - SessionAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityDto' }
    post:
      summary: Create Activity (Admin)
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, description, pointValue, completionLimit]
              properties:
                type: { type: string, enum: [CHALLENGE, MISSION] }
                title: { type: string }
                description: { type: string }
                pointValue: { type: integer, minimum: 1 }
                completionLimit: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityDto' }

  /activities/{id}:
    get:
      summary: Get Challenge or Mission by ID
      description: Returns activity by ID. When requested by a student, includes per-student progress fields (completionCount, isBanned, isDone, verificationStatus).
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityDto' }
    patch:
      summary: Update Activity Metadata (point value is immutable) (Admin only)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActivityMetadataDto' }
      responses:
        '200':
          description: Activity updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityDto' }
    delete:
      summary: Remove Activity (Admin only)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Activity removed

  /activities/{id}/submissions:
    post:
      summary: Submit Verification Request (Student)
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [textDescription]
              properties:
                textDescription: { type: string }
                fileAttachmentUrl: { type: string }
